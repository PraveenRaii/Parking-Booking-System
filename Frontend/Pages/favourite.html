<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Favourite Parking</title>

    <link rel="stylesheet" href="../Css/favourite.css">
</head>
<body>

<div class="container">

    <header>

        <a href="index.html" class="back-btn">←</a>

        <h2>Favourite Parking</h2>

    </header>

    <div class="search-box">

        <input type="text" placeholder="Search Favourite Parking">

    </div>

    <div class="fav-list">

        <!-- Card 1 -->

        <div class="fav-card">

            <img src="images/parking1.jpg">

            <div class="fav-content">

                <h3>Central Parking</h3>

                <p><img src="../icon/location_on_20dp_000000_FILL0_wght400_GRAD0_opsz20.svg" alt=""> Hazratganj, Lucknow</p>

                <span><img src="../icon/star_26dp_000000_FILL0_wght400_GRAD0_opsz24.svg" alt=""> 4.8</span>

                <h4>₹80/hr</h4>

                <button>View Details</button>

            </div>

            <button class="heart"><img src="../icon/favorite_23dp_000000_FILL0_wght400_GRAD0_opsz24.svg" alt=""></button>

        </div>

        <!-- Card 2 -->

        <div class="fav-card">

            <img src="images/parking2.jpg">

            <div class="fav-content">

                <h3>Sattu Parking</h3>

                <p><img src="../icon/location_on_20dp_000000_FILL0_wght400_GRAD0_opsz20.svg" alt="">  Gomti Nagar</p>

                <span><img src="../icon/star_26dp_000000_FILL0_wght400_GRAD0_opsz24.svg" alt=""> 4.6</span>

                <h4>₹60/hr</h4>

                <button>View Details</button>

            </div>

            <button class="heart"><img src="../icon/favorite_23dp_000000_FILL0_wght400_GRAD0_opsz24.svg" alt=""></button>

        </div>

    </div>

</div>
<script src="../Js/favourite.js"></script>
</body>
</html>
