<!DOCTYPE html>
<html>
<head>
    <title>Profile</title>
    <link rel="stylesheet" href="../Css/profile.css">
</head>
<body>

<div class="profile-container">

    <div class="profile-top">

        <img src="../Images/profile.png" class="profile-img" id="userPhoto">

        <h2 id="userName">Praveen Rai</h2>

        <p id="userEmail">
            praveen@gmail.com
        </p>

    </div>

    <div class="profile-card">

        <p>
            <img src="../icon/phone_in_talk_24dp_000000_FILL0_wght400_GRAD0_opsz24.svg" alt="">
            <span id="userPhone">
                +91 9876543210
            </span>
        </p>

        <p>
            <img src="../icon/garage_24dp_000000_FILL0_wght400_GRAD0_opsz24.svg" alt=""> Total Bookings :
            <span id="bookingCount">
                0
            </span>
        </p>

        <p>
            <img src="../icon/favorite_23dp_000000_FILL0_wght400_GRAD0_opsz24.svg" alt=""> Favourite :
            <span id="favCount">
                0
            </span>
        </p>

    </div>

    <div class="menu">

        <button id="historyBtn">
            <img src="../icon/history_24dp_000000_FILL0_wght400_GRAD0_opsz24.svg" alt=""> Booking History
        </button>

        <button id="favoriteBtn">
            <img src="../icon/favorite_23dp_000000_FILL0_wght400_GRAD0_opsz24.svg" alt=""> Favourite Parking
        </button>

        <button id="settingBtn">
            <img src="../icon/settings_24dp_000000_FILL0_wght400_GRAD0_opsz24.svg" alt=""> Settings
        </button>

        <button id="logoutBtn">
            <img src="../icon/logout_24dp_000000_FILL0_wght400_GRAD0_opsz24.svg" alt=""> Logout
        </button>

    </div>

</div>

<script type="module" src="../Js/auth.js"></script>

</body>
</html>
