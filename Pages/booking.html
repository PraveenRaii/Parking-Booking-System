<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Book Parking</title>

<link rel="stylesheet" href="../Css/bokking.css">
</head>
<body>

<div class="booking-container">

    <h2>Book Parking Slot</h2>

    <div class="form-group">
        <label>Select Date</label>
        <input type="date" id="date">
    </div>

    <div class="form-group">
        <label>Entry Time</label>
        <input type="time" id="entryTime">
    </div>

    <div class="form-group">
        <label>Exit Time</label>
        <input type="time" id="exitTime">
    </div>

    <div class="form-group">
        <label>Vehicle Number</label>
        <input type="text"
        placeholder="UP32AB1234"
        id="vehicle">
    </div>

    <h3>Select Slot</h3>

    <div class="slots">

        <button class="slot">A1</button>
        <button class="slot">A2</button>
        <button class="slot">A3</button>

        <button class="slot">B1</button>
        <button class="slot">B2</button>
        <button class="slot">B3</button>

    </div>

    <div class="summary">

        <h3>Booking Summary</h3>

        <p>Rate : ₹80/hr</p>

        <p>Total :
            ₹<span id="totalAmount">0</span>
        </p>

    </div>

    <button id="continueBtn">
        Continue Payment
    </button>

</div>

<script src="../Js/booking.js"></script>

</body>
</html>
