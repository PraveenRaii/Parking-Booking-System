<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parking Booking System</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <!-- App titel  && filter button -->
    <div class="app">
        <header>
            <div class="title">
                <h1> Parking</h1>
                <h1>made easy</h1>
            </div>
            <button class="filter-btn"><img src="icon/filter_alt_50dp_000000_FILL0_wght700_GRAD0_opsz48.svg"></button>
        </header>

        <!-- Search Section -->
        <div class="search-section">
            <div class="search-box">
                <img src="icon/search_35dp_000000_FILL0_wght700_GRAD0_opsz40.svg">
                <input type="text" placeholder="Search parking...">
            </div>
        </div>

        <!-- Category Section -->
        <section class="category-section">
            <div class="section-title">
                <h2>Category</h2>
            </div>
          <div class="categories">
    <button class="active-category" data-type="car">Car</button>
    <button data-type="bike">Bike</button>
    <button data-type="ev">EV</button>
    <button data-type="bicycle">Bicycle</button>
    <button data-type="bus">Bus</button>
    <button data-type="auto">Auto</button>
</div>
        </section>

        <!-- Card-1 -->
        <section class="nearby-section">
            <h2>Nearby Space</h2>
            <div class="parking-cards">
                <div class="parking-card"
     data-type="car"
     data-name="Central Parking"
     data-rating="4.5"
     data-address="Hazratganj, Lucknow"
     data-price="80/hr"
     data-image="Images/car.png">

     <div class="card-img">
    <img src="Images/car.png" alt="">
</div>

<div class="card-content">
    <h3>Central Parking</h3>
    <p class="address">  <img src="icon/domain_26dp_000000_FILL0_wght400_GRAD0_opsz24.svg" alt="">Hazratganj, Lucknow</p>
    <span>₹80/hr</span>
</div>
              
                </div> 

                <!-- Card-2 -->
               <div class="parking-card"
     data-type="bike"
     data-name="Bike Parking"
     data-rating="4.2"
     data-address="Aliganj, Lucknow"
     data-price="40/hr"
     data-image="Images/bike.png">
     <div class="card-img">
    <img src="Images/bike.png" alt="">
</div>

<div class="card-content">
    <h3>Bike Parking</h3>
    <p class="address">  <img src="icon/domain_26dp_000000_FILL0_wght400_GRAD0_opsz24.svg" alt="">Aliganj, Lucknow</p>
    <span>₹40/hr</span>
</div>
               </div>

               <div class="parking-card"
     data-type="ev"
     data-name="EV Station"
     data-rating="4.8"
     data-address="Gomti Nagar, Lucknow"
     data-price="120/hr"
     data-image="Images/ev.png">

     <div class="card-img">
    <img src="Images/ev.png" alt="">
</div>

<div class="card-content">
    <h3>EV Station</h3>

    <p class="address">  <img src="icon/domain_26dp_000000_FILL0_wght400_GRAD0_opsz24.svg" alt="">Gomti Nagar, Lucknow</p>
    <span>₹120/hr</span>
</div>
               </div>

     <div class="parking-card"
     data-type="bus"
     data-name="Bus Stand Parking"
     data-rating="4.1"
     data-address="Charbagh, Lucknow"
     data-price="150/hr"
     data-image="Images/bus.png">
     <div class="card-img">
    <img src="Images/bus.png" alt="">
</div>

<div class="card-content">
    <h3>Bus Stand  Parking</h3>
    <p class="address"> <img src="icon/domain_26dp_000000_FILL0_wght400_GRAD0_opsz24.svg" alt="">Charbagh, Lucknow</p>
    <span>₹150/hr</span>
</div>
     </div>

                <!-- Card-3 -->
                
            </div>
        </section>

            <!-- Popular-section -->
        <section class="popular-section">
            <div class="section-title">
                <h2>Popular Parking</h2>
            </div>

            <div class="popular-card">
                <div class="popular-image">
                    <img src="Images/image1.png" alt="">
                </div>

                <div class="popular-content">
                    <h3>Waterloo Parking</h3>
                    <p class="address">
                        <img src="icon/domain_26dp_000000_FILL0_wght400_GRAD0_opsz24.svg" alt="">
                        Hazratganj, Lucknow
                    </p>
                    <div class="popular-bottom">
                        <span class="price">
                            <img src="icon/currency_rupee_20dp_000000_FILL0_wght400_GRAD0_opsz20.svg" alt="">
                            150/hr
                        </span>
                        <button class="book-btn">Book Now</button>
                    </div>
                </div>
            </div>
        </section>

        <!-- Nav bar -->
        <nav class="bottom-nav">
            <button class="nav-item active-nav home-btn">
                <img src="icon/home_30dp_000000_FILL0_wght400_GRAD0_opsz24.svg" alt="">
            </button>
            <button class="nav-item map-btn">
                <img src="icon/map_30dp_000000_FILL0_wght400_GRAD0_opsz24.svg" alt="">
            </button>
            <button class="scan-btn">
                <img src="icon/qr_code_scanner_30dp_000000_FILL0_wght400_GRAD0_opsz24.svg" alt="">
            </button>
            <button class="nav-item notification-btn">
                <img src="icon/notifications_30dp_000000_FILL0_wght400_GRAD0_opsz24.svg" alt="">
            </button>
            <button class="nav-item profile-btn">
                <img src="icon/account_circle_30dp_000000_FILL0_wght400_GRAD0_opsz24.svg" alt="">
            </button>
        </nav>
    </div>
   <script src="Js/script.js"></script>
</body>

</html>
